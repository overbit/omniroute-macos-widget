name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build
        run: swift build --product OmniRouteWidget

      - name: Build DMG
        env:
          VERSION: 0.0.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniRouteWidget-dmg
          path: dist/OmniRouteWidget.dmg
          if-no-files-found: error
