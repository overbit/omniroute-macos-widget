name: OmniRouteWidget

options:
  bundleIdPrefix: com.overbit
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OmniRouteWidget:
    type: application
    platform: macOS
    sources:
      - path: Sources/OmniRouteWidget
    info:
      path: Config/OmniRouteWidget-Info.plist
      properties:
        CFBundleDisplayName: OmniRoute Widget
        CFBundleName: OmniRouteWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.overbit.OmniRouteWidget
        PRODUCT_NAME: OmniRouteWidget
    dependencies:
      - target: OmniRouteDesktopWidget
        embed: true

  OmniRouteDesktopWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/OmniRouteDesktopWidget
      - path: Sources/OmniRouteCore/Models.swift
      - path: Sources/OmniRouteCore/OmniRouteClient.swift
    info:
      path: Config/OmniRouteDesktopWidget-Info.plist
      properties:
        CFBundleDisplayName: OmniRoute
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/OmniRouteDesktopWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.overbit.OmniRouteWidget.Widget
        PRODUCT_NAME: OmniRouteDesktopWidget
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Config/OmniRouteDesktopWidget.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES

schemes:
  OmniRouteWidget:
    build:
      targets:
        OmniRouteWidget: all
        OmniRouteDesktopWidget: all
    run:
      config: Debug
    archive:
      config: Release
